services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/crewai_web.db
    volumes:
      - crewai_web_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  crewai_web_data:
